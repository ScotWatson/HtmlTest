  <script>
    const eventListeners = new Map();
    function addEventListener(obj, eventName, handler) {
      let eventDictionary = eventListeners.get(obj);
      if (!eventDictionary) {
        eventDictionary = new Map();
        eventListeners.set(obj, eventDictionary);
      }
      let eventSet = eventDictionary.get(eventName);
      if (!eventSet) {
        eventSet = new Set();
        eventDictionary.set(eventName, eventSet);
      }
      eventSet.add(handler);
      obj.addEventListener(eventName, handler);
    }
    function removeAllEventListeners() {
      for (const [ obj, eventDictionary] of eventListeners) {
        for (const [ eventName, eventSet ] of eventDictionary) {
          for (const handler of eventSet) {
            obj.removeEventListener(eventName, handler);
          }
        }
      }
    }
